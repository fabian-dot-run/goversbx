schemaVersion: "2"
kind: mixin
name: goversbx-omp
version: "0.4.0"
displayName: goversbx network access (oh-my-pi)
description: >-
  Lets oh-my-pi (omp) request outbound network access through the goversbx daemon running on the
  host, with a human approving each host. Merges a goversbx-network entry into the active
  profile's <agentDir>/mcp.json and installs the goversbx-network-access skill there. sbx has no
  omp agent, so layer this onto a sandbox where omp is installed (e.g. shell). Does not install
  omp and does not start the daemon.

args:
  daemonHost:
    default: "host.docker.internal"
    description: "Hostname under which the sandbox reaches the goversbx daemon on the host"
    pattern: '^[A-Za-z0-9.-]+$'
  daemonPort:
    default: "8787"
    description: "The daemon's sandbox-facing port (GOVERSBX_SANDBOX_API_PORT)"
    pattern: '^[0-9]{1,5}$'

permissions:
  network:
    allow:
      - "localhost:${{ kit.args.daemonPort }}"
      - "${{ kit.args.daemonHost }}:${{ kit.args.daemonPort }}"

environment:
  variables:
    GOVERSBX_DAEMON_HOST: "${{ kit.args.daemonHost }}"
    GOVERSBX_DAEMON_PORT: "${{ kit.args.daemonPort }}"

setup:
  startup:
    - command: ["sh", "/home/agent/.local/share/goversbx/register-omp-mcp.sh"]
      user: "agent"
      description: Register the goversbx-network MCP endpoint in omp's mcp.json and install the skill

agentInstructions:
  content: |
    ## Network access via goversbx

    Outbound network access from this sandbox is restricted. If the sandbox proxy blocks a request
    (HTTP 403, "Approval required for <host>", "Blocked by network policy"), or you need a host that
    is probably not allowed yet, call `request_network_access` on the `goversbx-network` MCP server
    instead of asking the user to run `sbx policy approval ...` / `sbx policy allow ...`: it asks the
    human on the host, waits for the decision and applies it. Approvals are permanent for this
    sandbox. Not for "Blocked by org policy" or "Blocked by local rule" (deny rules win). The
    `goversbx-network-access` skill has the details.
