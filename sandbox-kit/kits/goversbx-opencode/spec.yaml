schemaVersion: "2"
kind: mixin
name: goversbx-opencode
version: "0.2.7"
displayName: goversbx network access (opencode)
description: >-
  Lets opencode request outbound network access through the goversbx daemon running on the host,
  with a human approving each host. Merges a goversbx-network entry into
  ~/.config/opencode/opencode.json and installs the goversbx-network-access skill. Does not start
  the daemon - it must already run on the host.

# opencode is a built-in sbx agent (`sbx create opencode ...`), unlike pi/omp.
requires:
  agent: opencode

args:
  daemonHost:
    default: "host.docker.internal"
    description: "Hostname under which the sandbox reaches the goversbx daemon on the host"
    pattern: '^[A-Za-z0-9.-]+$'
  daemonPort:
    default: "8787"
    description: "The daemon's sandbox-facing port (GOVERSBX_SANDBOX_API_PORT)"
    pattern: '^[0-9]{1,5}$'

permissions:
  network:
    allow:
      # The sbx proxy sees sandbox traffic to host.docker.internal as localhost (verified with
      # scripts/diagnose-substitution.sh, sbx v0.48.0); the second entry covers a daemonHost that
      # is not host.docker.internal.
      - "localhost:${{ kit.args.daemonPort }}"
      - "${{ kit.args.daemonHost }}:${{ kit.args.daemonPort }}"

environment:
  variables:
    GOVERSBX_DAEMON_HOST: "${{ kit.args.daemonHost }}"
    GOVERSBX_DAEMON_PORT: "${{ kit.args.daemonPort }}"

setup:
  install:
    # Install time, like the claude kit: finishes before the session reads its config, where a
    # startup command might not (race with the detached dispatcher). Idempotent (rewrites only our
    # own `mcp.goversbx-network` entry), so a startup fallback below is safe to also run.
    # install[].command MUST be a string (sh -c <string>) - a list is a schema error here, unlike
    # startup[].command which MUST be a list (docker/sbx-kits-contrib spec/SPEC-v2.md, 5.6).
    - command: "sh /home/agent/.local/share/goversbx/register-opencode-mcp.sh"
      user: "agent"
      description: Register the goversbx-network MCP endpoint in opencode's config (install-time, race-free)
  startup:
    - command: ["sh", "/home/agent/.local/share/goversbx/register-opencode-mcp.sh"]
      user: "agent"
      description: Register the goversbx-network MCP endpoint in opencode's config (startup fallback)

agentInstructions:
  content: |
    ## Network access via goversbx

    Outbound network access from this sandbox is restricted. If the sandbox proxy blocks a request
    (HTTP 403, "Approval required for <host>", "Blocked by network policy"), or you need a host that
    is probably not allowed yet, call `request_network_access` on the `goversbx-network` MCP server
    instead of asking the user to run `sbx policy approval ...` / `sbx policy allow ...`: it asks the
    human on the host, waits for the decision and applies it. Approvals are permanent for this
    sandbox. Not for "Blocked by org policy" or "Blocked by local rule" (deny rules win). The
    `goversbx-network-access` skill has the details.
