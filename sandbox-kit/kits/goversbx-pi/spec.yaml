schemaVersion: "2"
kind: mixin
name: goversbx-pi
version: "0.1.0"
displayName: goversbx network access (pi)
description: >-
  Lets the pi coding agent (>= 1.0) request outbound network access through the goversbx daemon
  running on the host, with a human approving each host. Merges a goversbx-network entry into
  ~/.pi/agent/mcp.json and installs the goversbx-network-access skill into ~/.agents/skills.
  sbx has no pi agent, so layer this onto a sandbox where pi is installed (e.g. shell). Does not
  install pi and does not start the daemon.

args:
  daemonHost:
    default: "host.docker.internal"
    description: "Hostname under which the sandbox reaches the goversbx daemon on the host"
    pattern: '^[A-Za-z0-9.-]+$'
  daemonPort:
    default: "8787"
    description: "The daemon's sandbox-facing port (GOVERSBX_SANDBOX_API_PORT)"
    pattern: '^[0-9]{1,5}$'

permissions:
  network:
    allow:
      - "localhost:${{ kit.args.daemonPort }}"
      - "${{ kit.args.daemonHost }}:${{ kit.args.daemonPort }}"

environment:
  variables:
    GOVERSBX_DAEMON_HOST: "${{ kit.args.daemonHost }}"
    GOVERSBX_DAEMON_PORT: "${{ kit.args.daemonPort }}"

setup:
  startup:
    # Startup, not install: the script comes from files/, and pi only reads mcp.json when it is
    # launched by hand later anyway. The merge is idempotent (rewrites only our own entry).
    - command: ["sh", "/home/agent/.local/share/goversbx/register-pi-mcp.sh"]
      user: "agent"
      description: Register the goversbx-network MCP endpoint in ~/.pi/agent/mcp.json

agentInstructions:
  content: |
    ## Network access via goversbx

    Outbound network access from this sandbox is restricted. If the sandbox proxy blocks a request
    (HTTP 403, "Approval required for <host>", "Blocked by network policy"), or you need a host that
    is probably not allowed yet, call `request_network_access` on the `goversbx-network` MCP server
    instead of asking the user to run `sbx policy approval ...` / `sbx policy allow ...`: it asks the
    human on the host, waits for the decision and applies it. Approvals are permanent for this
    sandbox. Not for "Blocked by org policy" or "Blocked by local rule" (deny rules win). The
    `goversbx-network-access` skill has the details.
