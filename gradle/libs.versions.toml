[versions]
jackson = "2.18.2"
javalin = "6.4.0"
slf4j = "2.0.16"
mcp-sdk = "2.0.1"
junit = "5.11.4"
junit-platform = "1.11.4"
shadow = "9.6.1"

[libraries]
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }
javalin = { module = "io.javalin:javalin", version.ref = "javalin" }
javalin-testtools = { module = "io.javalin:javalin-testtools", version.ref = "javalin" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
mcp-sdk = { module = "io.modelcontextprotocol.sdk:mcp", version.ref = "mcp-sdk" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
graalvm-native = { id = "org.graalvm.buildtools.native", version = "1.1.14" }
